spring:
  application:
    name: service-auth

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:aee19b3f805e6cf87a186db77479e69621cfdb368545c91542896ef884e23b92}
    access-token-expiration-minutes: 15
    issuer: ${JWT_ISSUER}


